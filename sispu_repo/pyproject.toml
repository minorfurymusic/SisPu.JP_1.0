[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sispubint"
version = "0.1.0"
description = "Sistema Público Interno desktop em Python + PySide6 + PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0"
]

[project.scripts]
sispubint = "sispubint.main:main"

[tool.setuptools.packages.find]
where = ["src"]
